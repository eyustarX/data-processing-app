name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests (Week 01)
      run: |
        python -m unittest discover -s week-01/tests -v

    - name: Run Task Application (Week 01)
      run: |
        python week-01/task.py

    - name: Run Unit Tests (Week 02)
      run: |
        python -m unittest discover -s week-02/tests -v

    - name: Run Task Application (Week 02)
      run: |
        python week-02/task.py
